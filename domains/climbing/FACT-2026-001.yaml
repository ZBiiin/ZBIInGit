type: fact
id: FACT-2026-001
title: 社会体育指导员（攀岩）国家职业资格：报考渠道与费用口径
category: 证书
issuer: |
  各省（区、市）体育行业职业技能鉴定站组织鉴定（非全国统考）；
  证书由人力资源和社会保障部统一印制，属准入类国家职业资格；
  业务指导单位为国家体育总局人力资源开发中心（职业技能鉴定指导中心）
channel: |
  1. 前置条件：经备案培训机构完成五级/初级正规培训达标准学时并取得结业证书；
  2. 网上报名：国家体育总局职业技能鉴定网络管理平台 www.sportosta.org.cn；
  3. 各省鉴定站联系方式表 http://www.tyrc.org.cn/uploads/file/lxfs.xls；
  4. 证书查验：www.sportosta.org.cn 与 osta.mohrss.gov.cn；
  5. 政策资讯：中国体育人才网 www.tyrc.org.cn、微信公众号"体育总局职鉴指导中心"
cost: |
  鉴定费为政府定价（2025 年官方通知实例）：甘肃五级 315 元（甘发改收费〔2016〕945 号）、
  山东五级 150 元/四级 170 元（补考实操 120、理论 30）、四川往期 230 元每人（换证 115 元）；
  培训费由机构收取（山东 2025）：五级 2400 元、四级 3600 元；
  初级拿证总预算约 2500 至 4000 元，另加保险约 30 元、交通食宿自理
validity: |
  晋升路径：五级/初级 → 四级/中级（持证+从业满1年+中级培训结业）→ 三级/高级（同+1年）；
  证书本身有效期与复审要求在所查通知中未载明，此项不确定，需询省鉴定站
scope: |
  适用于高危险性体育项目（攀岩）健身指导从业，岩馆经营法定需配备持证人员
  （《全民健身条例》、第一批高危险性体育项目目录）；
  不含中国登山协会攀岩指导员/定线员培训认证（另一体系，勿混用）；
  费用与班次各省各年不同，本卡数值仅为 2025 年通知实例，不可外推为当前当地标准
source: |
  1.《体育行业国家职业资格考试报考指南》体育总局人力中心 2021-08-27
     https://www.sport.gov.cn/rlzx/n5631/c23462443/content.html
  2. 甘肃省 2025 年第一期攀岩鉴定通知
     https://www.gssstzx.com/HdAtt/att/2025/03/2025032110294817256.pdf
  3. 山东省 2025-11 初级培训通知
     http://ty.shandong.gov.cn/sdtiy/tzgg1/202510/t20251021_4857064.html
  4. 山东省 2025-09 中级培训通知
     http://ty.shandong.gov.cn/sdtiy/tzgg1/202508/t20250815_4843113.html
  5. 冒用职鉴指导中心名义招生的官方声明
     http://www.sport.gov.cn/rlzx/n5631/c29555143/content.html
  核对日期 2026-10
