# 事实卡模板：复制到 domains/<领域>/ 目录，核对官方来源后填写，再运行校验
# 校验命令: python kb_validator.py domains/
# 铁律: source 字段没有官方来源的内容一律不得入库
type: fact
id: FACT-2026-000            # 命名规范: FACT-年份-三位序号
title: 一句话事实描述，含证书/政策/行情名称
category: 证书               # 条目类别: 证书 / 政策 / 行情
issuer: |
  发证或主管机构（官方全称）
channel: |
 报考或办理渠道（官网或主管部门）
cost: |
  费用构成与大致金额（注明币种与依据）
validity: |
  有效期与复审换证要求
scope: |
  适用范围与局限（对什么场景有效、不能代替什么）
source: |
  信息来源: 官方文件名称或网址 + 核对日期（必填）
meta:
  version: v1.0
  date: 2026-10              # 格式 YYYY-MM，填核对日期
  owner: 负责人姓名
  status: 草稿               # 允许值: 草稿 / 生效 / 已废弃
